<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Stats · Alex Hendershott</title>
<link rel="stylesheet" href="/style.css">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5}
h1{font-size:28px;margin-bottom:24px}
h2{font-size:16px;margin:40px 0 12px}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.tile{border:1px solid var(--rule);border-radius:8px;padding:12px 14px}
.tile b{display:block;font-size:26px;font-variant-numeric:tabular-nums}
.tile span{font-size:13px;color:var(--muted)}
.chart{display:flex;align-items:flex-end;gap:3px;height:140px;border-bottom:1px solid var(--rule)}
.col{flex:1;height:100%;display:flex;align-items:flex-end}
.col i{display:block;width:100%;background:var(--fg);border-radius:2px 2px 0 0;min-height:1px}
.axis{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
table{width:100%;border-collapse:collapse}
td{padding:8px 0;border-bottom:1px solid var(--rule)}
td.n{text-align:right;font-variant-numeric:tabular-nums;width:80px}
.note{font-size:14px;color:var(--muted);margin-top:40px}
@media (max-width:560px){.tiles{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
<header class="site"><a href="/"><img class="av" src="/images/avatar.jpg" alt="" width="36" height="36">Alex Hendershott</a></header>
<h1>Stats</h1>
<p id="status" class="muted">Loading…</p>
<div class="tiles">
<div class="tile"><b id="today">–</b><span>Views today</span></div>
<div class="tile"><b id="u30">–</b><span>Visitors, 30 days</span></div>
<div class="tile"><b id="w30">–</b><span>Views, 30 days</span></div>
<div class="tile"><b id="all">–</b><span>Views, all time</span></div>
</div>
<h2>Daily views, last 30 days</h2>
<div class="chart" id="chart"></div>
<div class="axis"><span id="a0"></span><span id="a1"></span></div>
<h2>Pages (all time)</h2>
<table id="pages"></table>
<p class="note" id="me"></p>
</main>
<script>
(async function(){
var B="https://abacus.jasoncameron.dev/get/alexhendershott-com/";
var START="20261015";
var sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var cache={};try{cache=JSON.parse(store.get("statscache")||"{}")}catch(e){}
var chain=Promise.resolve(),done=0,total=0,st=document.getElementById("status");
function get(k){
  total++;
  var run=async function(){
    for(var t=0;t<4;t++){
      try{
        var r=await fetch(B+k);
        if(r.status===404)return 0;
        if(r.status===429){await sleep(6000);continue}
        var j=await r.json();return j.value||0;
      }catch(e){await sleep(1000)}
    }
    return 0;
  };
  var p=chain.then(run).then(function(v){done++;st.textContent="Loading… "+done+"/"+total;return v});
  chain=p.then(function(){return sleep(350)});
  return p;
}
var fmt=new Intl.DateTimeFormat("en-CA",{timeZone:"America/New_York"});
var days=[];for(var i=29;i>=0;i--)days.push(fmt.format(new Date(Date.now()-i*864e5)).replace(/-/g,""));
var recent={};recent[days[29]]=1;recent[days[28]]=1;
function dayVal(prefix,d){
  var k=prefix+d;
  if(d<START)return Promise.resolve(0);
  if(!recent[d]&&k in cache)return Promise.resolve(cache[k]);
  return get(k).then(function(v){if(!recent[d])cache[k]=v;return v});
}
var pages=[["Home","p.home"]];
try{
  var html=await (await fetch("/")).text();
  var doc=new DOMParser().parseFromString(html,"text/html");
  doc.querySelectorAll("ul.posts a[href]").forEach(function(a){
    var k=a.getAttribute("href").replace(/\.html$/,"").replace(/^\/+|\/+$/g,"").replace(/\//g,".").replace(/[^A-Za-z0-9_.-]/g,"-");
    pages.push([a.textContent.trim(),("p."+k).slice(0,64)]);
  });
}catch(e){}
var allP=get("total");
var viewsP=Promise.all(days.map(function(d){return dayVal("d.",d)}));
var visP=Promise.all(days.map(function(d){return dayVal("u.",d)}));
var pageP=Promise.all(pages.map(function(p){return get(p[1])}));
var views=await viewsP,vis=await visP,all=await allP,pv=await pageP;
store.set("statscache",JSON.stringify(cache));
var sum=function(a){return a.reduce(function(x,y){return x+y},0)};
document.getElementById("today").textContent=views[29];
document.getElementById("u30").textContent=sum(vis);
document.getElementById("w30").textContent=sum(views);
document.getElementById("all").textContent=all;
var max=Math.max.apply(null,views.concat([1]));
var lab=function(d){return new Date(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6)).toLocaleDateString("en-US",{month:"short",day:"numeric"})};
document.getElementById("chart").innerHTML=views.map(function(v,i){
  return '<div class="col" title="'+lab(days[i])+': '+v+' views, '+vis[i]+' people"><i style="height:'+Math.round(100*v/max)+'%"></i></div>';
}).join("");
document.getElementById("a0").textContent=lab(days[0]);
document.getElementById("a1").textContent=lab(days[29]);
var rows=pages.map(function(p,i){return [p[0],pv[i]]}).sort(function(a,b){return b[1]-a[1]});
var esc=function(s){var e=document.createElement("span");e.textContent=s;return e.innerHTML};
document.getElementById("pages").innerHTML=rows.map(function(r){return "<tr><td>"+esc(r[0])+'</td><td class="n">'+r[1]+"</td></tr>"}).join("");
st.textContent="Updated "+new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})+". Hover a bar for that day.";
var me=document.getElementById("me");
me.innerHTML=store.get("nt")?'Your visits from this browser are not counted. <a href="/?track">Count them again</a>.':'Your visits from this browser are counted. <a href="/?notrack">Stop counting them</a>.';
})();
</script>
</body>
</html>
